[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "star-aberration-diagnostics"
version = "0.10.0"
description = "Diagnostics of the optical system from the shapes of the stars (port of the PixInsight script StarAberrationDiagnostics)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Sven Kopetzki" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "astropy>=6.0",
    "PySide6>=6.6",
    "anthropic>=1.0",
    "xisf>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
star-aberration = "star_aberration.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
